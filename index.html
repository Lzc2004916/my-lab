<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Card — Rich Text Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <!--
      ═══════════════════════════════════════════════════════════════════════════
      Splash Screen — Renders instantly before Vue/JS boots.
      Vue's app.mount('#app') replaces this content naturally on initialization.
      Displays a centered loading GIF while the app initializes.
      ═══════════════════════════════════════════════════════════════════════════
    -->
    <style>
      /* ── Reset & Base ──────────────────────────────────────────────────── */
      *{ box-sizing: border-box; margin: 0; padding: 0; }

      html {
        font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-size: 16px;
        line-height: 1.6;
      }

      body {
        height: 100vh;
        /* DaisyUI base-200 light */
        background-color: oklch(0.95 0.008 260);
        overflow: hidden;
      }

      /* ── Dark mode body override ──────────────────────────────────────── */
      html[data-theme='dark'] body {
        background-color: oklch(0.22 0.03 260);
      }

      /* ══════════════════════════════════════════════════════════════════════
         Splash Container — Centered GIF loading screen
         ══════════════════════════════════════════════════════════════════ */

      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* DaisyUI base-200 light */
        background-color: oklch(0.95 0.008 260);
        overflow: hidden;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      /* 淡出：Vue 挂载前由 JS 添加此类 */
      .splash.splash-fade-out {
        opacity: 0;
        pointer-events: none;
      }

      html[data-theme='dark'] .splash {
        background-color: oklch(0.22 0.03 260);
      }

      .splash-loading-gif {
        max-width: 600px;
        max-height: 600px;
        width: auto;
        height: auto;
      }

      .splash-loading-text {
        margin-top: 28px;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
        font-size: 1.8rem;
        font-weight: 800;
        color: oklch(0.20 0.02 260 / 0.82);
        letter-spacing: 0.08em;
      }

      html[data-theme='dark'] .splash-loading-text {
        color: oklch(0.88 0.01 260 / 0.82);
      }
    </style>

    <!--
      Theme detection — runs before first paint to avoid flash of wrong theme.
      Checks localStorage first, then system preference.
    -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        // 记录页面加载时间戳，供 main.ts 计算 splash 已显示时长
        window.__SPLASH_START__ = Date.now();
      })();
    </script>
  </head>

  <body>
    <!--
      ═══════════════════════════════════════════════════════════════════════════
      #app — Vue mounts here, replacing the splash screen on initialization.
      The splash renders instantly as static HTML; zero JS required.
      ═══════════════════════════════════════════════════════════════════════════
    -->
    <div id="app">
      <div class="splash" role="status" aria-label="Application loading">
        <div style="display: flex; flex-direction: column; align-items: center;">
          <img
            class="splash-loading-gif"
            src="/loading/createLoading.gif"
            alt="Loading"
          />
          <p class="splash-loading-text">不要着急。。。你不是吉吉国王</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
